@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1f33;--text:#eef1fa;--muted:#a3abc2;--accent:#818cf8;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1f33;--text:#eef1fa;--muted:#a3abc2;--accent:#818cf8;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:440px;text-align:center}
.avatar{width:104px;height:104px;border-radius:50%;margin:8px auto 16px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899);box-shadow:var(--shadow)}
h1{margin:0;font-size:1.7rem}
.en{color:var(--muted);margin:2px 0 0;font-size:1rem}
.tag{display:inline-block;margin:14px 0 28px;padding:4px 16px;border-radius:999px;background:var(--card);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
.links{display:flex;flex-direction:column;gap:14px}
.links a{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--card);color:var(--text);text-decoration:none;font-weight:600;font-size:1.05rem;box-shadow:var(--shadow);transition:transform .15s}
.links a:hover,.links a:active{transform:translateY(-2px)}
.ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:22px;height:22px;fill:#fff}
.yt{background:#ff0000}.fb{background:#1877f2}.ig{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)}.gg{background:#4285f4}
.sub{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
footer{margin-top:32px;color:var(--muted);font-size:.85rem}
